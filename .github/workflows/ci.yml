name: CI

# Runs on every pull request and every push to main. A red CI blocks deployment (see deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Lint (frontend)
        run: npm --prefix frontend run lint

      - name: Type-check
        run: |
          npx --prefix frontend tsc --noEmit -p frontend/tsconfig.app.json
          npm --prefix backend run typecheck

      - name: Build backend
        run: npm --prefix backend run build

      # VITE_API_URL=/api is how production is built: it keeps the (lazy) admin code in the bundle,
      # so the size budget is measured on what visitors really get.
      - name: Build frontend and check the bundle budget
        env:
          VITE_API_URL: /api
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run check:size

  backend-tests:
    name: Backend tests (Vitest + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Tests use their own database (14) and refuse to run against any other.
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend test

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci
          npm --prefix e2e ci

      - name: Install Chromium for Playwright
        run: npx --prefix e2e playwright install --with-deps chromium

      # The suite boots its own isolated stack (backend :4100, frontend :8180, Redis database 15).
      - name: Run end-to-end tests
        run: npm --prefix e2e test

      - name: Upload the Playwright report (traces and screenshots of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Production dependencies only: build tools never reach visitors. Fails on high/critical advisories.
      - name: Audit backend
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: Audit frontend
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      # Builds (does not push) so a broken Dockerfile is caught on the pull request, not at deploy time.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

# Production stack. Runs on any machine with Docker (a small VPS is plenty).
#
#   internet --> gateway (Caddy: HTTPS, compression, routing)
#                  |-- /api/*  --> backend (Express)  --> redis (private network only)
#                  |-- /*      --> web (nginx, static site)
#
# Only the gateway publishes ports; Redis and the API are unreachable from outside.
# Setup and day-to-day commands: deploy/README.md
name: portfolio

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # ":80" = plain HTTP (local testing). A domain such as "example.com" = automatic HTTPS (Let's Encrypt).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep them or Let's Encrypt rate limits will bite
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/iamshuvokd/shuvo_portfolio}-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/iamshuvokd/shuvo_portfolio}-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}@redis:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      CORS_ORIGINS: ${SITE_URL:-}
      TRUST_PROXY: "1" # exactly one proxy (the gateway) sits in front of the API
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly = durable: your edited content and uploads survive restarts and reboots.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  redis-data:
  caddy-data:
  caddy-config:

# Included in every location (nginx does not inherit add_header across levels once a location sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy: scripts only from this site. Styles allow 'unsafe-inline' because
# framer-motion and the UI library set inline styles. Fonts come from Google, the contact fallback
# posts to EmailJS; images may be data:/blob: (3D texture) or https (admin-entered image links).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.emailjs.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Text compression (Caddy in front also encodes; this keeps the image fine on its own).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Liveness probe for the container healthcheck.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build output never changes under the same name: cache it for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Real files (images, icons, robots.txt...) get a short cache; they are not content-hashed.
  location ~* \.(?:ico|png|jpg|jpeg|webp|svg|txt)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths (/admin, deep links) get index.html, which must never be cached,
  # otherwise visitors keep an old page that points at deleted asset files.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

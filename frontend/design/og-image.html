<!doctype html>
<!--
  Source for public/og-image.png (the link-preview card shown on LinkedIn, WhatsApp, Slack, X...).
  Edit the text/colours here, then regenerate with:  npm run og:image   (from the repo root)
  Rendered at exactly 1200x630, the size social platforms expect.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #080b12;
        --card: #0f141d;
        --fg: #f5f8fb;
        --muted: #9fb0c3;
        --primary: #16e0bd; /* matches the site's teal */
        --accent: #f7a83e;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(circle at 82% 28%, rgba(22, 224, 189, 0.26), transparent 38%),
          radial-gradient(circle at 8% 92%, rgba(247, 168, 62, 0.16), transparent 34%),
          var(--bg);
        position: relative;
      }
      /* faint engineering grid, same motif as the site hero */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(to right, black 0%, black 55%, transparent 100%);
      }
      .frame {
        position: absolute; inset: 28px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(15, 20, 29, 0.78), rgba(8, 11, 18, 0.35));
      }
      .content {
        position: absolute; inset: 0;
        padding: 0 84px;
        display: flex; align-items: center; justify-content: space-between; gap: 40px;
      }
      .text { max-width: 650px; }
      .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 10px 20px;
        border: 1px solid rgba(22, 224, 189, 0.35);
        background: rgba(22, 224, 189, 0.1);
        color: var(--primary);
        border-radius: 999px;
        font-size: 24px; font-weight: 600;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 14px var(--primary); }
      h1 {
        margin-top: 30px;
        font-size: 92px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 700;
      }
      h1 span { color: var(--primary); }
      .tag {
        margin-top: 26px;
        font-size: 33px; line-height: 1.35; color: var(--muted); font-weight: 500;
      }
      .tag b { color: var(--fg); font-weight: 600; }
      .url {
        margin-top: 38px;
        display: flex; gap: 22px; align-items: center;
        font-size: 24px; color: var(--muted);
      }
      .bar { width: 64px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); }

      .photo-wrap { position: relative; width: 340px; height: 340px; flex: none; margin-right: 10px; }
      .glow { position: absolute; inset: -46px; border-radius: 50%; background: radial-gradient(circle, rgba(22, 224, 189, 0.34), transparent 66%); }
      .ring {
        position: absolute; inset: -14px; border-radius: 50%;
        border: 3px solid var(--primary);
        box-shadow: 0 0 40px rgba(22, 224, 189, 0.45), inset 0 0 30px rgba(22, 224, 189, 0.18);
      }
      .ring2 { position: absolute; inset: -34px; border-radius: 50%; border: 1px solid rgba(22, 224, 189, 0.25); }
      .photo { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 6px solid var(--card); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="content">
      <div class="text">
        <div class="pill"><span class="dot"></span>Sr. Software Engineer &amp; AI Engineer</div>
        <h1>Shuvo<br /><span>Kumar Das</span></h1>
        <p class="tag">Building intelligent products with <b>AI</b>, <b>automation</b> &amp; scalable software.</p>
        <div class="url"><span class="bar"></span><span>Portfolio</span></div>
      </div>
      <div class="photo-wrap">
        <div class="glow"></div>
        <div class="ring2"></div>
        <div class="ring"></div>
        <img class="photo" src="profile-source.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
